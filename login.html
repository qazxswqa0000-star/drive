<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleDrive - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/latin.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a0e1a; color: #f5f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    .bg-canvas { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55; animation: float 20s infinite ease-in-out; }
    .orb-1 { width: 400px; height: 400px; background: #0a84ff; top: -100px; left: -100px; }
    .orb-2 { width: 300px; height: 300px; background: #bf5af2; bottom: -50px; right: -50px; }
    .login-container { position: relative; z-index: 2; background: rgba(22, 28, 45, 0.65); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 2.5rem; border-radius: 22px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.45); }
    .logo-text { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; text-align: center; background: linear-gradient(135deg, #f5f5f7, #8e8e93); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sub-text { text-align: center; color: #8e8e93; font-size: 0.9rem; margin-bottom: 2rem; }
    .input-group { margin-bottom: 1.2rem; }
    .input-group label { display: block; font-size: 0.85rem; color: #8e8e93; margin-bottom: 0.4rem; font-weight: 500; }
    .input-group input { width: 100%; padding: 0.8rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.2s; }
    .input-group input:focus { border-color: #0a84ff; background: rgba(22, 28, 45, 0.9); }
    .login-btn { width: 100%; padding: 0.9rem; margin-top: 1rem; background: linear-gradient(135deg, #0a84ff, #5e5ce6); border: none; border-radius: 12px; color: white; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(10, 132, 255, 0.45); }
  </style>
</head>
<body>
  <div class="bg-canvas"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
  <div class="login-container">
    <div class="logo-text">TeleDrive</div>
    <div class="sub-text">Login to Telegram via API</div>
    <form action="/api/login" method="POST">
      <div class="input-group">
        <label>API ID</label>
        <input type="text" name="api_id" placeholder="e.g. 37870860" required>
      </div>
      <div class="input-group">
        <label>API Hash</label>
        <input type="text" name="api_hash" placeholder="Enter API Hash" required>
      </div>
      <div class="input-group">
        <label>Phone Number</label>
        <input type="text" name="phone_number" placeholder="+8801..." required>
      </div>
      <button type="submit" class="login-btn">Send OTP</button>
    </form>
  </div>
</body>
</html>
